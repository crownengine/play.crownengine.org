<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
  body {
    margin: 0px;
    background-color: black;
  }
  .app {
    display: block;
    border: 0px;
    margin: 0px;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    color: #f0f0f0;
    font: 14px sans-serif;
    text-align: center;
  }
  #loading_progress {
    width: min(480px, 80vw);
    height: 2px;
    background-color: #101010;
    overflow: hidden;
  }
  #loading_progress > div {
    width: var(--progress, 0%);
    height: 100%;
    background-color: #f0f0f0;
  }
  #loading_progress:not([aria-valuenow]) > div {
    width: 2px;
    animation: loading-pulse 1s ease-in-out infinite alternate;
  }
  @keyframes loading-pulse {
    from { opacity: 0.25; }
    to { opacity: 1; }
  }
</style>
</head>

<script type='text/javascript'>
  var loading = document.getElementById('loading');
  var loadingStatus = document.getElementById('loading_status');
  var loadingProgress = document.getElementById('loading_progress');
  var loadingFailed = false;
  var loadingPercent = 0;
  function setLoadingProgress(percent) {
    loadingPercent = Math.max(loadingPercent, percent);
    loadingProgress.setAttribute('aria-valuenow', loadingPercent);
    loadingProgress.style.setProperty('--progress', loadingPercent + '%');
  }
  function loadingError(message) {
    loadingFailed = true;
    loading.style.display = 'flex';
    loadingStatus.textContent = 'Failed to load. Please reload the page.';
    loadingProgress.removeAttribute('aria-valuenow');
    console.error(message);
  }
  var Module = {
    arguments: [],
    preRun: [],
    postRun: [],
    canvas: (() => {
      var canvas = document.getElementById('canvas');
      canvas.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);
      return canvas;
    })(),
    onRuntimeInitialized: () => { Module.onSplashProgress(0, 1); },
    onSplashProgress: (completed, total) => {
      if (loadingFailed) return;
      loadingStatus.textContent = 'Initializing...';
      setLoadingProgress(50 + 50 * completed / total);
      if (completed === total) {
        requestAnimationFrame(() => {
          if (!loadingFailed) loading.style.display = 'none';
        });
      }
    },
    setStatus: (text) => {
      if (loadingFailed || !text) return;
      loadingStatus.textContent = text;
      var match = text.match(/\(([\d.]+)\/([\d.]+)\)/);
      if (match && Number(match[2]) > 0) {
        setLoadingProgress(Math.min(1, Number(match[1]) / Number(match[2])) * 50);
      }
    },
    totalDependencies: 0,
    monitorRunDependencies: (left) => {
      Module.totalDependencies = Math.max(Module.totalDependencies, left);
      Module.setStatus(left ? 'Preparing... (' + (Module.totalDependencies - left) + '/' + Module.totalDependencies + ')' : 'Preparing...');
    },
    onAbort: loadingError
  };
  window.onerror = loadingError;
  window.addEventListener('error', (event) => {
    if (event.target.tagName === 'SCRIPT')
      loadingError('Failed to load ' + event.target.src);
  }, true);
  function startRuntime() {
    var scripts = ['crown-release.js'];
    scripts.unshift('data.js');
    for (var src of scripts) {
      var script = document.createElement('script');
      script.src = src;
      script.async = true;
      document.body.appendChild(script);
    }
  }
  window.addEventListener('load', () => {
    if (PerformanceObserver.supportedEntryTypes.includes('paint')) {
      var paintObserver = new PerformanceObserver((list) => {
        if (!list.getEntriesByName('first-contentful-paint').length) return;
        paintObserver.disconnect();
        startRuntime();
      });
      paintObserver.observe({ type: 'paint', buffered: true });
    } else {
      requestAnimationFrame(() => {
        setTimeout(startRuntime, 0);
      });
    }
  });
</script>
